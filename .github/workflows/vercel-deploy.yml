name: Deploy to Vercel (production)

# Auto-deploy: every push to main (and manual dispatch) ships to production.
# Secrets required (repo Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      — Vercel API token
#   VERCEL_ORG_ID     — Vercel org/team id
#   VERCEL_PROJECT_ID — Vercel project id
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel
        # VERCEL_ORG_ID + VERCEL_PROJECT_ID env vars make the CLI link
        # non-interactively; the build itself runs on Vercel's cloud.
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
